    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        :root {
            color-scheme: dark;
            --p97-bg: #050816;
            --p97-card: rgba(15, 23, 42, 0.68);
            --p97-line: rgba(148, 163, 184, 0.18);
            --p97-red: #ff3b5f;
            --p97-cyan: #22d3ee;
        }
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 20% 0%, rgba(34, 211, 238, 0.16), transparent 32rem),
                radial-gradient(circle at 85% 18%, rgba(255, 59, 95, 0.18), transparent 28rem),
                linear-gradient(135deg, #020617 0%, #050816 48%, #111827 100%);
            color: #ffffff;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(circle at center, black, transparent 72%);
        }
        .p97-shell {
            background: linear-gradient(180deg, rgba(8, 17, 31, 0.88), rgba(2, 6, 23, 0.98));
            box-shadow: 0 36px 140px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.16);
        }
        .p97-glass {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.76), rgba(2, 6, 23, 0.58));
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 24px 70px rgba(0,0,0,.34);
            backdrop-filter: blur(22px);
        }
        .p97-aurora {
            background: conic-gradient(from 180deg, rgba(34,211,238,.18), rgba(255,59,95,.22), rgba(99,102,241,.16), rgba(34,211,238,.18));
            filter: blur(28px);
        }
        .p97-primary {
            background: linear-gradient(135deg, #ff3b5f, #fb7185 48%, #22d3ee);
            box-shadow: 0 16px 45px rgba(255, 59, 95, 0.28);
        }
        .p97-page {
            background:
                radial-gradient(circle at 12% 8%, rgba(34, 211, 238, 0.16), transparent 18rem),
                radial-gradient(circle at 88% 22%, rgba(255, 59, 95, 0.18), transparent 20rem),
                linear-gradient(180deg, rgba(15, 23, 42, 0.76), rgba(2, 6, 23, 0.92));
        }
        .p97-title {
            background: linear-gradient(90deg, #ffffff 0%, #cffafe 48%, #fecdd3 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .p97-soft {
            background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
            border: 1px solid rgba(255,255,255,.12);
        }
        .p97-danger {
            background: radial-gradient(circle at center, rgba(255, 59, 95, 0.35), transparent 62%), linear-gradient(135deg, #ef4444, #be123c);
            box-shadow: 0 24px 70px rgba(239, 68, 68, 0.38);
        }

        .p97-luxe-bg {
            position: relative;
            isolation: isolate;
            background:
                radial-gradient(circle at 50% -12%, rgba(248, 113, 113, 0.24), transparent 26rem),
                radial-gradient(circle at 8% 8%, rgba(125, 211, 252, 0.18), transparent 20rem),
                radial-gradient(circle at 95% 28%, rgba(168, 85, 247, 0.15), transparent 22rem),
                linear-gradient(180deg, #08111f 0%, #020617 48%, #05030a 100%);
        }
        .p97-luxe-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(115deg, rgba(255,255,255,.16), transparent 24%, transparent 70%, rgba(255,255,255,.05));
            opacity: .5;
            z-index: -1;
        }
        .p97-luxe-card {
            background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.055) 45%, rgba(255,255,255,.025));
            border: 1px solid rgba(255,255,255,.18);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 28px 80px rgba(0,0,0,.34);
            backdrop-filter: blur(28px) saturate(1.35);
        }
        .p97-luxe-card:hover {
            border-color: rgba(255,255,255,.26);
            transform: translateY(-1px);
        }
        .p97-section {
            position: relative;
            overflow: hidden;
            border-radius: 2rem;
            padding: 1.5rem;
        }
        .p97-section::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(120deg, rgba(255,255,255,.14), transparent 34%);
            opacity: .38;
        }
        .p97-field {
            width: 100%;
            border-radius: 1.25rem;
            border: 1px solid rgba(255,255,255,.14);
            background: linear-gradient(180deg, rgba(2,6,23,.72), rgba(15,23,42,.48));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 14px 38px rgba(0,0,0,.18);
            color: #fff;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }
        .p97-field:focus {
            border-color: rgba(125,211,252,.62);
            box-shadow: 0 0 0 4px rgba(34,211,238,.10), inset 0 1px 0 rgba(255,255,255,.14);
            transform: translateY(-1px);
        }
        .p97-field::placeholder {
            color: rgba(148,163,184,.58);
        }
        .p97-mini-card {
            background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.035));
            border: 1px solid rgba(255,255,255,.13);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
        }
        .p97-icon-tile {
            background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
            border: 1px solid rgba(255,255,255,.14);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 16px 40px rgba(0,0,0,.22);
        }
        .p97-luxe-title {
            letter-spacing: -0.075em;
            background: linear-gradient(100deg, #fff 0%, #e0f2fe 34%, #fecdd3 68%, #fff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 18px 60px rgba(255,255,255,.14);
        }
        .p97-chrome-pill {
            background: linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.05));
            border: 1px solid rgba(255,255,255,.16);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
        }
        .p97-sos-luxe {
            background:
                radial-gradient(circle at 50% 30%, rgba(255,255,255,.26), transparent 18%),
                linear-gradient(135deg, #ff375f 0%, #ff2d55 42%, #7f1d1d 100%);
            box-shadow: 0 28px 80px rgba(255,45,85,.38), inset 0 1px 0 rgba(255,255,255,.28);
        }
        .p97-safe-orb {
            background:
                radial-gradient(circle at 35% 25%, rgba(255,255,255,.36), transparent 18%),
                radial-gradient(circle at center, rgba(34,197,94,.34), rgba(6,95,70,.18) 58%, rgba(2,6,23,.88) 100%);
            border: 1px solid rgba(134,239,172,.26);
            box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 35px 100px rgba(34,197,94,.18), inset 0 1px 0 rgba(255,255,255,.18);
        }
        .p97-danger-room {
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 45, 85, .46), transparent 24rem),
                radial-gradient(circle at 16% 18%, rgba(251, 113, 133, .20), transparent 18rem),
                linear-gradient(180deg, #1f0308 0%, #09030a 58%, #020617 100%);
        }
        .p97-scrollbar::-webkit-scrollbar { width: 4px; }
        .p97-scrollbar::-webkit-scrollbar-thumb { background: rgba(148,163,184,.25); border-radius: 99px; }
        .emergency-pulse {
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .leaflet-container {
            background: #0a0a0a !important;
            border: none !important;
        }
        .leaflet-control-attribution {
            display: none !important;
        }
    </style>
