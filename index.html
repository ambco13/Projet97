    <style>
        :root {
            color-scheme: dark;
            --p97-bg: #050816;
            --p97-card: rgba(15, 23, 42, 0.68);
            --p97-line: rgba(148, 163, 184, 0.18);
            --p97-red: #ff3b5f;
            --p97-cyan: #22d3ee;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #ffffff;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: none;
        }
        .p97-shell {
            background: #050505;
            box-shadow: 0 30px 80px rgba(0,0,0,.48);
        }
        .p97-glass {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.76), rgba(2, 6, 23, 0.58));
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 24px 70px rgba(0,0,0,.34);
            backdrop-filter: blur(22px);
        }
        .p97-aurora {
            background: conic-gradient(from 180deg, rgba(34,211,238,.18), rgba(255,59,95,.22), rgba(99,102,241,.16), rgba(34,211,238,.18));
            filter: blur(28px);
        }
        .p97-primary {
            background: linear-gradient(135deg, #ff3b5f, #fb7185 48%, #22d3ee);
            box-shadow: 0 16px 45px rgba(255, 59, 95, 0.28);
        }
        .p97-page {
            background:
                radial-gradient(circle at 12% 8%, rgba(34, 211, 238, 0.16), transparent 18rem),
                radial-gradient(circle at 88% 22%, rgba(255, 59, 95, 0.18), transparent 20rem),
                linear-gradient(180deg, rgba(15, 23, 42, 0.76), rgba(2, 6, 23, 0.92));
        }
        .p97-title {
            background: linear-gradient(90deg, #ffffff 0%, #cffafe 48%, #fecdd3 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .p97-soft {
            background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
            border: 1px solid rgba(255,255,255,.12);
        }
        .p97-danger {
            background: radial-gradient(circle at center, rgba(255, 59, 95, 0.35), transparent 62%), linear-gradient(135deg, #ef4444, #be123c);
            box-shadow: 0 24px 70px rgba(239, 68, 68, 0.38);
        }

        .p97-luxe-bg {
            position: relative;
            isolation: isolate;
            background: #050505;
        }
        .p97-luxe-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: none;
            opacity: 0;
            z-index: -1;
        }
        .p97-luxe-card {
            background: #111113;
            border: 1px solid rgba(255,255,255,.10);
            box-shadow: none;
            backdrop-filter: none;
        }
        .p97-luxe-card:hover {
            border-color: rgba(255,255,255,.18);
        }
        .p97-section {
            position: relative;
            overflow: hidden;
            border-radius: 1.75rem;
            padding: 1.5rem;
        }
        .p97-section::before {
            content: none;
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: transparent;
            opacity: 0;
        }
        .p97-field {
            width: 100%;
            border-radius: 1rem;
            border: 1px solid rgba(148,163,184,.18);
            background: #0b0b0c;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.045);
            color: #fff;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }
        .p97-field:focus {
            border-color: rgba(255,255,255,.36);
            background: #111113;
            box-shadow: 0 0 0 3px rgba(255,59,95,.14);
        }
        .p97-field::placeholder {
            color: rgba(148,163,184,.58);
        }
        .p97-mini-card {
            background: #171719;
            border: 1px solid rgba(255,255,255,.10);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
        }
        .p97-icon-tile {
            background: #171719;
            border: 1px solid rgba(255,255,255,.10);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
        }
        .p97-luxe-title {
            letter-spacing: -0.055em;
            color: #f8fafc;
            text-shadow: none;
        }
        .p97-chrome-pill {
            background: #171719;
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
        }
        .p97-sos-luxe {
            background: #ff3b5f;
            box-shadow: none;
        }
        .p97-language-trigger,
        .p97-toggle-action {
            background: #171719;
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
            backdrop-filter: blur(18px);
        }
        .p97-language-menu {
            background: #171719;
            border: 1px solid rgba(255,255,255,.10);
            box-shadow: 0 18px 40px rgba(0,0,0,.38);
            backdrop-filter: none;
        }
        .p97-language-item {
            border: 1px solid transparent;
            background: transparent;
        }
        .p97-language-item-active {
            border-color: rgba(255,59,95,.28);
            background: rgba(255,59,95,.11);
        }
        .p97-safe-orb {
            background: #0f1f17;
            border: 1px solid rgba(134,239,172,.18);
            box-shadow: none;
        }
        .p97-danger-room {
            background: #090304;
        }
        .p97-scrollbar::-webkit-scrollbar { width: 4px; }
        .p97-scrollbar::-webkit-scrollbar-thumb { background: rgba(148,163,184,.25); border-radius: 99px; }
        .emergency-pulse {
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .leaflet-container {
            background: #0a0a0a !important;
            border: none !important;
        }
        .leaflet-control-attribution {
            display: none !important;
        }
    </style>
